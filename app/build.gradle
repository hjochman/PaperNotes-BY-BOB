plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('VERSION')
def appVersionName = versionFile.exists() ? versionFile.text.trim() : '0.1.0'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'local.papernotes'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'local.papernotes'
        minSdk 29
        targetSdk 29
        versionCode 6
        versionName appVersionName
    }

    signingConfigs {
        release {
            def keyAliasProp = keystoreProperties.getProperty('PAPYRUS_KEY_ALIAS')
            def keyPasswordProp = keystoreProperties.getProperty('PAPYRUS_KEY_PASSWORD')
            def storePasswordProp = keystoreProperties.getProperty('PAPYRUS_STORE_PASSWORD')
            def storeFileProp = keystoreProperties.getProperty('storeFile')

            if (keyAliasProp && keyPasswordProp && storePasswordProp) {
                def ksFile = storeFileProp ? rootProject.file(storeFileProp) : rootProject.file('patch-key.jks')
                if (ksFile.exists()) {
                    storeFile ksFile
                    storePassword storePasswordProp
                    keyAlias keyAliasProp
                    keyPassword keyPasswordProp
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseSigningConfig = signingConfigs.getByName('release')
            if (releaseSigningConfig.storeFile != null && releaseSigningConfig.storeFile.exists()) {
                signingConfig releaseSigningConfig
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        disable 'ExpiredTargetSdkVersion', 'GradleDependency', 'NewerVersionAvailable', 'ObsoleteSdkInt'
    }
}

// Ein Release-APK/-Bundle ohne vollständige Signierung bricht ab, statt still unsigniert zu entstehen.
// Debug-Builds, test, lint, lintRelease und lintVitalRelease bleiben unberührt (prüft nur den Task-Graphen).
gradle.taskGraph.whenReady { graph ->
    def producesReleaseArtifact = ['assembleRelease', 'bundleRelease', 'packageRelease'].any {
        graph.hasTask("${project.path}:${it}")
    }
    def releaseSigning = android.signingConfigs.getByName('release')
    if (producesReleaseArtifact && (releaseSigning.storeFile == null || !releaseSigning.storeFile.exists())) {
        def missing = []
        if (!keystorePropertiesFile.exists()) {
            missing << 'keystore.properties im Projektwurzelverzeichnis fehlt'
        } else {
            ['PAPYRUS_STORE_PASSWORD', 'PAPYRUS_KEY_ALIAS', 'PAPYRUS_KEY_PASSWORD'].each {
                if (!keystoreProperties.getProperty(it)) {
                    missing << "Eintrag ${it} in keystore.properties fehlt"
                }
            }
            def storeFileProp = keystoreProperties.getProperty('storeFile')
            def ksFile = storeFileProp ? rootProject.file(storeFileProp) : rootProject.file('patch-key.jks')
            if (!ksFile.exists()) {
                missing << "Keystore-Datei ${ksFile.name} fehlt"
            }
        }
        throw new GradleException(
            'Release-Build abgebrochen: Die Signierung ist nicht vollständig konfiguriert ('
            + missing.join('; ')
            + '). Ein unsigniertes Release-APK wird nicht erzeugt. Abhilfe: keystore.properties mit '
            + 'PAPYRUS_STORE_PASSWORD, PAPYRUS_KEY_ALIAS und PAPYRUS_KEY_PASSWORD sowie patch-key.jks '
            + '(oder storeFile=<Pfad>) im Projektwurzelverzeichnis ablegen, siehe AGENT.md, Abschnitt "Signieren".')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.code.gson:gson:2.12.1'
    // WebDAV (MKCOL, MOVE, PROPFIND) kann HttpURLConnection nicht senden. Nur HTTPS, Standard-Zertifikatsprüfung (Nextcloud-Sync).
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    compileOnly project(':eink-stub')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.4.0'
}
